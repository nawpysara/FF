                let rekomendasi = Object.keys(skor).reduce((a, b) => skor[a] > skor[b] ? a : b);
                container.innerHTML = `
                    <h3 style="color: #5A8C48; margin-bottom: 8px; text-align: center;">Rekomendasi Jalurmu: ${rekomendasi}</h3>
                    <p style="font-size: 0.9rem; color: #475569; margin-bottom: 20px; text-align: center;">Berdasarkan jawabanmu, kamu paling cocok melanjutkan ke jenjang <b>${rekomendasi}</b>.</p>
                    <button class="btn-mulai" onclick="filterDariQuiz('${rekomendasi}')" style="width: 100%;">Lihat Peta Sekolah ${rekomendasi}</button>
                `;
            }
        }

        function pilihJawab(poin) {
            skor[poin]++;
            indexSoal++;
            muatSoal();
        }

      function filterDariQuiz(jenjang) {
            document.getElementById('quiz-page').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            initMap();
            let targetBtn = Array.from(document.querySelectorAll('.filter-btn')).find(b => b.innerText === jenjang);
            if(targetBtn) filterJenjang(jenjang, targetBtn);
        }
        
        function initMap() {
            map = L.map('map').setView([-7.875, 112.528], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            muatMarker(dataSekolah);
        }

        function muatMarker(data) {        
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            data.forEach(s => {               
                let warnaPin = s.jenjang === 'SMA' ? '#98a9cb' : (s.jenjang === 'SMK' ? '#f8eea5' : '#a6dda6');
                
                let customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${warnaPin}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>`,
                    iconSize: [14, 14]
                });
                
                let marker = L.marker([s.lat, s.lng], { icon: customIcon }).addTo(map);
                
                marker.bindPopup(`
                    <div style="font-family: 'Poppins', sans-serif;">                    
                        <h4 style="color: #2e528ae8; margin-bottom: 4px;">${s.nama}</h4>
                      
            <p style="font-size: 0.8rem; color: #334155; margin-bottom: 2px;">
                <b>Keunggulan/Fokus:</b> ${s.deskripsi}
            </p>
            <p style="font-size: 0.8rem; color: #334155; margin-bottom: 2px;">
                <b>Alamat:</b> ${s.alamat}
            </p>
            <p style="font-size: 0.3rem; color: #334155; margin-bottom: 2px;">
                <b>Email:</b> ${s.email}
            </p>
             <p style="font-size: 12px; margin-bottom: 2px;"><b>Jenjang:</b> ${s.jenjang} | <b>Akreditasi:</b> ${s.akreditasi}</p>
              <div style="margin-top: 8px;">
                            <a href="https://maps.google.com/?q=${encodeURIComponent(s.nama + ' ' + s.alamat)}" target="_blank" style="font-size: 0.7rem; color: #358051c0; font-weight: 600; text-decoration: none;"> Rute Maps</a>
 &bull; 
                            <a href="${s.web}" target="_blank" style="font-size: 12px; color: #234c8acc; text-decoration: none; font-weight: 600;">Website Sekolah</a>
                        </div>
                    </div>
                `);

                markers.push(marker);
            });
        }
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggle-btn');
            sidebar.classList.toggle('collapsed');
            
            if (sidebar.classList.contains('collapsed')) {
                btn.innerHTML = '▶'; 
            } else {
                btn.innerHTML = '◀'; 
            }

            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 300);
        }

        function tampilkanDaftar(data) {
            const container = document.getElementById('daftar-sekolah-container');
            container.innerHTML = '';

            data.forEach(s => {
                let div = document.createElement('div');
                div.className = 'school-item';
                div.innerHTML = `
                    <h4>${s.nama}</h4>
                    <span>Jenjang: ${s.jenjang} | Akreditasi: ${s.akreditasi}</span>
                `;

                div.onclick = () => {
                    map.setView([s.lat, s.lng], 15);
                };
                container.appendChild(div);
            });
        }

        function filterJenjang(jenjang, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(jenjang === 'Semua') {
                muatMarker(dataSekolah);
                tampilkanDaftar(dataSekolah);
            } else {
                let hasilFilter = dataSekolah.filter(s => s.jenjang === jenjang);
                muatMarker(hasilFilter);
                tampilkanDaftar(hasilFilter);
            }
        }
    </script>
</body>
</html>
